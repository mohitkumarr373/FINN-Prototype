services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    volumes: ["finn-data:/app/data"]
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "finn.worker", "watch"]
    env_file: .env
    volumes: ["finn-data:/app/data"]
    restart: unless-stopped
volumes:
  finn-data:
